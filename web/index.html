<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live3DGSAvatar · 实时预览</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <h1>Live3DGSAvatar</h1>
  <span class="build" id="build-tag" title="构建标记">…</span>
  <div class="conn">
    <span id="conn-dot" class="dot dot--off" title="连接状态"></span>
    <span id="conn-text">未连接</span>
  </div>
  <div class="spacer"></div>
  <div class="stats" id="stats">
    <span title="画面帧率">
      画面 <b id="stat-fps">–</b> FPS
    </span>
    <span><b id="stat-frame">–</b> ms/帧</span>
    <span>deform <b id="stat-deform">–</b></span>
    <span>raster <b id="stat-raster">–</b></span>
    <span>丢帧 <b id="stat-dropped">0</b></span>
    <span>显存 <b id="stat-mem">–</b> MiB</span>
  </div>
  <button id="btn-settings" class="icon topbar__gear" aria-expanded="false"
          title="设置">⚙</button>
</header>

<main>
  <section class="viewer">
    <div class="stage" id="stage">
      <!-- 对比画面在**左侧**：目标图（数据集 images/）在下，渲染在右。
           开启对比时给 .stage 加 is-compare，用 CSS 改布局。 -->
      <canvas id="canvas-target" width="512" height="512" hidden></canvas>
      <canvas id="canvas" width="512" height="512"></canvas>
      <div class="stage-overlay" id="overlay">
        <p id="overlay-text">等待连接…</p>
      </div>
    </div>

    <!-- 播放条：仿视频播放器，放在画面下方 -->
    <div class="player" id="player">
      <div class="player-row">
        <button id="btn-play" class="icon" title="播放 / 暂停">▶</button>
        <button id="btn-step-back" class="icon" title="上一帧（←）">◀|</button>
        <button id="btn-step-fwd" class="icon" title="下一帧（→）">|▶</button>
        <input id="f-frame" type="range" min="0" max="253" step="1" value="0"
               title="拖动跳到指定帧">
        <span class="counter"><b id="o-frame">0</b> / <span id="o-total">–</span></span>
      </div>

      <div class="player-row player-row--sub">
        <span class="hint" id="live-status" hidden></span>
        <label class="inline" title="并排显示数据集原图并计算 PSNR">
          <input id="f-compare" type="checkbox"> 对比原图
        </label>
        <span class="hint" id="psnr-out" hidden>–</span>
        <label class="inline">
          <input id="f-perturb" type="checkbox"> 调试·随机扰动
        </label>
        <label class="inline" title="随机扰动的幅度">
          幅度 <output id="o-amp">0.10</output>
          <input id="f-amp" type="range" min="0" max="0.5" step="0.01" value="0.1">
        </label>
      </div>
    </div>
  </section>

  <!-- 轻量提示条：慢操作的结果（成功/失败）在这里停留几秒 -->
  <div class="toast" id="toast" hidden><span id="toast-text"></span></div>

  <!-- 全页加载浮窗：只在"慢且可能失败"的操作期间显示（换模型/换数据集）。
       覆盖整个页面并拦交互 —— 这类操作期间点别的东西只会让状态更乱。 -->
  <div class="busy" id="busy" hidden>
    <div class="busy__box">
      <div class="busy__spinner" aria-hidden="true"></div>
      <p id="busy-text">正在处理…</p>
    </div>
  </div>

  <aside class="panel">
    <!-- 模型在最上面：先决定"渲染谁"，再决定"用什么驱动"。 -->
    <details open>
      <summary>模型</summary>
      <div class="fields">
        <label>对象
          <select id="f-subject"></select>
        </label>
        <label>版本
          <select id="f-work-name"></select>
        </label>
        <button id="btn-load">加载模型</button>
        <!-- 中途往 models/ 里放了新模型时，用它重新扫描 -->
        <button id="btn-refresh-models" class="ghost" title="重新扫描 models/ 目录">
          刷新列表
        </button>
        <p class="hint" id="model-info"></p>
      </div>
    </details>

    <details open>
      <summary>驱动</summary>
      <div class="fields">
        <label>方式
          <select id="f-source">
            <option value="checkpoint">数据集（自带参数）</option>
            <option value="live">RDF 实时追踪</option>
          </select>
        </label>
        <label>数据集
          <select id="f-dataset"></select>
        </label>
        <!-- 中途往 data_root 里放了新数据集时，用它重新扫描 -->
        <button id="btn-refresh-datasets" class="ghost" title="重新扫描数据集目录">
          刷新列表
        </button>
        <p class="hint" id="dataset-info"></p>
      </div>
    </details>

    <details>
      <summary>操作</summary>
      <div class="fields">
        <button id="btn-pause">暂停推流</button>
        <button id="btn-capture">截取当前帧</button>
        <button id="btn-reconnect">重连</button>
      </div>
    </details>

    <p class="hint" id="mock-note" hidden>
      本地预览：后端未连接。启动后端后刷新即可看到真实画面。
    </p>
  </aside>
</main>

<!-- 设置浮窗：内容由 app/settings.py 的注册表驱动，前端不硬编码控件 -->
<div class="dialog" id="settings-dialog" hidden>
  <div class="dialog__panel" role="dialog" aria-modal="true" aria-label="设置">
    <header class="dialog__head">
      <h2>设置</h2>
      <span class="hint" id="settings-source">–</span>
      <span class="spacer"></span>
      <button id="btn-settings-close" class="icon" title="关闭（Esc）">✕</button>
    </header>
    <nav class="tabs" id="settings-tabs" role="tablist"></nav>
    <div class="dialog__body" id="settings-body"></div>
    <footer class="dialog__foot">
      <button id="btn-settings-reset">放弃修改</button>
      <span class="hint" id="settings-status">–</span>
      <span class="spacer"></span>
      <button id="btn-settings-save" class="primary">保存并应用</button>
    </footer>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
