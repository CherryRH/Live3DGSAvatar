# Live3DGSAvatar —— 系统配置
#
# 本文件集中存放**路径类与设备类**配置；
# 渲染参数见 configs/render.yaml，训练/在线更新见 configs/train.yaml。
# 字段说明见 docs/CONFIG.md。所有路径支持三种写法：
#   1. 绝对路径                     /home/you/Datasets/INSTA
#   2. 以 ~ 开头                     ~/Datasets/INSTA
#   3. 相对仓库根                    ../other-project
#
# 环境变量可覆盖任意字段（便于换机器 / CI 不改文件）：
#   LIVE3DGS_DATA_ROOT  → paths.data_root
#   LIVE3DGS_OUTPUT_DIR → paths.output_dir
#
# 用 `python scripts/show_config.py` 查看**解析后**的最终值。

# 人物名 / 工作名 —— 两级目录：models/<subject>/<work_name>/
#
#   * subject   人物名。既用于**数据集**（<data_root>/<subject>/），
#               也用于**模型**（<models_dir>/<subject>/<work_name>/）
#   * work_name 一次训练/导出的名字（通常为 `test`）
#
# 参照实现与本项目用同一套名字解析各自的模型路径：
#   模型 → <paths.models_dir>/<subject>/<work_name>/model.ply
#
# 切换对象只需改这两处（脚本的 --subject / --work-name 可临时覆盖）。
# 当前使用的对象。模型在 <models_dir>/<subject>/<work_name>/，
# 数据集目录与 subject 同名时无需设 data_dir（见下）。
#
# 现有对象：
#   duda / test         旧数据集（checkpoint 格式，需 FLAME 前向；仅作回归对照）
#   crh_1 / test        新采集（render_inputs.npz，自包含，**推荐**）
#   crh_2 / test        新采集（同上）
subject: crh_1
work_name: test

paths:
  # 数据集根目录。默认读取 <data_root>/<subject>/。
  # 数据集目录名与 subject 不一致时，用下面的 data_dir 显式指定。
  data_root: /home/crh/Datasets/INSTA

  # 显式指定数据集目录（绝对路径，或相对仓库根）。null 表示用
  # <data_root>/<subject>。
  #
  # 为什么需要它：`subject` 同时用于**模型**目录（models/<subject>/<work_name>/），
  # 而数据集目录名未必与它相同。例如：
  #   model  → models/crh/crh_1/model.ply        (subject=crh, work_name=crh_1)
  #   data   → Datasets/INSTA/crh_1              (而非 INSTA/crh/crh_1)
  # 这种情形设 data_dir 即可，不必为了目录名去改 subject。
  data_dir: null

  # 产物根目录。设置类脚本默认写到 <output_dir>/<脚本名>/
  # （例如 output_dir=output 时，渲染测试写 output/render_test/）。
  output_dir: output

  # 本项目自己的模型根目录。模型按 <models_dir>/<subject>/<work_name>/ 存放，
  # 模型按两级目录存放，便于同一人物多个训练版本共存。
  models_dir: models

  # FLAME 资产目录（含 generic_model.pkl 与 flame_uv.npz）。
  # null 表示用仓库根的 data/FLAME2020/。
  flame_dir: null

  # 显式指定模型文件。留空（null）表示用
  # <models_dir>/<subject>/<work_name>/model.ply。
  # 若模型在别处，直接写绝对路径。
  #
  # 也可用 models_config 显式指定各模型随附的 config.yaml；
  # null 表示从模型目录里读 config.yaml。
  model_ply: null
  models_config: null

  # 渲染结果图（数据集原图）相对 <data_root>/<subject>/ 的子目录。
  # 用作 PSNR 的 GT。
  image_subdir: images

# 运行设备与精度。
runtime:
  device: cuda          # cuda | cpu（cpu 仅供不依赖 CUDA 内核的自检）
  split: all            # 参照数据集切分：all | train | test

# GUI 服务。仅本地单用户使用，不做鉴权、不绑公网地址。
app:
  # ⚠️ 用 `localhost` 而**不是** `127.0.0.1`。
  # 本机 /etc/hosts 里 `localhost` 优先解析为 IPv6 `::1`，而浏览器对
  # `http://localhost:8000` 会先试 `::1`；若只绑 IPv4，Windows 上的浏览器
  # 会「无法连接」，而 VS Code 内置浏览器（走 127.0.0.1）却正常 —— 曾实际踩到。
  # `localhost` 会同时绑定 `::1` 与 `127.0.0.1`，两种写法都能访问。
  # 局域网访问再改成 0.0.0.0（注意本服务无鉴权）。
  host: localhost
  port: 8000
  # 打开页面时是否自动开始推帧。
  autostart: true
  # 后端统计日志的间隔（秒）。日志走 stdout，**与前端 FPS 解耦**：
  # 前端算"对方实际看到的"，后端记"服务端真实渲染吞吐"。
  stats_log_interval_s: 10.0
  # 启动时预载多少帧。**-1 表示全部**（推荐）：
  # 帧数据很小（254 帧约 15 MiB），预载全部才能让「数据集帧」滑块走满全程。
  # 若设成小值，滑块会被夹在已载入范围内（曾因此只能播前 20 帧）。
  preload_frames: -1

# GPU 冒烟 / 渲染测试的采样规模上限。
# 帧数取 min(该值, 数据集实际帧数)；null 表示全部。
smoke:
  max_frames: null
