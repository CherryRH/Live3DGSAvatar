# Live3DGSAvatar —— 系统配置
#
# 本文件集中存放**路径类与设备类**配置；
# 渲染参数见 configs/render.yaml，训练/在线更新见 configs/train.yaml。
# 字段说明见 docs/CONFIG.md。所有路径支持三种写法：
#   1. 绝对路径                     /home/you/Datasets/INSTA
#   2. 以 ~ 开头                     ~/Datasets/INSTA
#   3. 相对仓库根                    ../other-project
#
# 环境变量可覆盖任意字段（便于换机器 / CI 不改文件）：
#   LIVE3DGS_DATA_ROOT  → paths.data_root
#   LIVE3DGS_OUTPUT_DIR → paths.output_dir
#
# 用 `python scripts/show_config.py` 查看**解析后**的最终值。

paths:
  # 数据集根目录：每个子目录是一个数据集（<data_root>/<名字>/）。
  # 具体用哪个由界面选择，不在这里写死；启动时为空也没关系。
  data_root: datasets

  # 产物根目录。设置类脚本默认写到 <output_dir>/<脚本名>/
  # （例如 output_dir=output 时，渲染测试写 output/render_test/）。
  output_dir: output

  # 模型根目录。按 <models_dir>/<对象>/<版本>/ 两级存放，
  # 便于同一对象保留多个版本。
  models_dir: models

  # FLAME 资产目录（含 generic_model.pkl 与 flame_uv.npz）。
  flame_dir: data/FLAME2020

  # 模型文件名（相对 <models_dir>/<对象>/<版本>/）。
  # 若模型放在别处，可写绝对路径（脚本的 --ply 就是这么用的）。
  model_ply: model.ply
  models_config: config.yaml

  # 数据集里**抠好人像**的子目录（黑底 RGBA）。
  # 用作训练/在线更新的目标，以及界面上「对比原图」与 PSNR 的参照。
  image_subdir: images

# 实时驱动。追踪器以**独立进程**运行（环境不兼容），本项目把画面发过去、
# 拿回参数与顶点。见 docs/LIVE_DRIVING.md。
tracking:
  # 总开关。关闭后实时驱动不可用，界面会显示原因。
  enabled: true
  # 追踪服务地址（scripts/rdf_bridge.py 监听）。
  host: 127.0.0.1
  port: 8980
  # 超过这么久没有新观测就认为中断（秒）。
  max_age_s: 1.0
  # 送给追踪服务的画面节奏上限（帧/秒）。0 表示不限（以追踪速度为准）。
  # 追踪一次约 60–70 ms，设太高只会让服务器排队。
  source_fps: 30.0
  # 送哪个目录的画面给追踪服务：auto | input | images
  #   input/  原始画面（自然背景）—— 与真摄像头同分布，首选
  #   images/ 抠图人像（黑底）—— 有些数据集只有这一份，作回退
  #   auto    有 input/ 就用它，否则用 images/
  frame_subdir: auto

# 运行设备与精度。
runtime:
  device: cuda          # cuda | cpu（cpu 仅供不依赖 CUDA 内核的自检）
  split: all            # 参照数据集切分：all | train | test

# GUI 服务。仅本地单用户使用，不做鉴权、不绑公网地址。
app:
  # ⚠️ 用 `localhost` 而**不是** `127.0.0.1`。
  # 本机 /etc/hosts 里 `localhost` 优先解析为 IPv6 `::1`，而浏览器对
  # `http://localhost:8000` 会先试 `::1`；若只绑 IPv4，Windows 上的浏览器
  # 会「无法连接」，而 VS Code 内置浏览器（走 127.0.0.1）却正常 —— 曾实际踩到。
  # `localhost` 会同时绑定 `::1` 与 `127.0.0.1`，两种写法都能访问。
  # 局域网访问再改成 0.0.0.0（注意本服务无鉴权）。
  host: localhost
  port: 8000
  # 打开页面时是否自动开始推帧。
  autostart: true
  # 后端统计日志的间隔（秒）。日志走 stdout，**与前端 FPS 解耦**：
  # 前端算"对方实际看到的"，后端记"服务端真实渲染吞吐"。
  stats_log_interval_s: 10.0
  # 启动时预载多少帧。**-1 表示全部**（推荐）：
  # 帧数据很小（254 帧约 15 MiB），预载全部才能让「数据集帧」滑块走满全程。
  # 若设成小值，滑块会被夹在已载入范围内（曾因此只能播前 20 帧）。
  preload_frames: -1

# GPU 冒烟 / 渲染测试的采样规模上限。
# 帧数取 min(该值, 数据集实际帧数)；null 表示全部。
smoke:
  # 0 表示不限制
  max_frames: 0
