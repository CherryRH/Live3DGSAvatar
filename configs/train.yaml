# Live3DGSAvatar —— 训练与在线更新配置
#
# 本文件集中存放**训练相关**的默认量；路径与设备见 configs/system.yaml，
# 渲染相关见 configs/render.yaml。字段说明见 docs/CONFIG.md。
#
# 这些参数都可以在 GUI 的「设置」浮窗里改并保存（写入 configs/local.yaml），
# 但只有标记为可编辑的才会真正作用到运行中的服务 —— 见 app/settings.py。

train:
  # 完整训练管线（待接入协作者的训练代码）。
  # 关闭时，任何训练入口都应直接报错退出，而不是静默跳过 ——
  # 静默跳过会让人以为"训练过了"。
  pipeline:
    # 训练入口：scripts/train.py。默认超参与 models/crh_1/test/config.yaml
    # 一致：batch 10、50000 步、blend_start 3000、末尾 350 帧作验证。
    enabled: true
    iterations: 50000
    batch_size: 10
    # 前 N 步不启用形变基（先用模板网格拟合静态外观）
    blend_start: 3000
    # 位置类学习率的尺度（1.0 = 米制默认）。头部约 0.2 m 时通常保持 1.0，
    # 换到量级完全不同的场景才需要调。
    scene_extent: 1.0
    # 验证集比例：0.3 = 末尾 30% 作验证，其余训练。
    # 增强集按**同一比例**切分（它的验证部分不参与训练）。
    test_ratio: 0.3
    # 背景在损失里的权重：1 = 与前景同权（推荐）。
    # 设 0 会让落在人像之外的高斯拿不到梯度，推理时表现为"头周围发散"。
    mask_weight: 1.0
    # 感知损失：默认 0（只用 L1，最稳）。SSIM 抑制 L1 的过度平滑，
    # 基础训练可试 0.02–0.05；LPIPS 更贵、容易带来颜色/纹理副作用，
    # 建议 20000 步后再开 0.01–0.03。权重是相对 L1 的，别照搬后训练的 0.2。
    ssim_weight: 0.05
    lpips_weight: 0.0
    lpips_from: 20000
    # 验证频率与早停：每 eval_every 步验证一次，连续 patience 次无提升
    # （提升幅度小于 min_delta 视为无提升）就停。500×2 ≈ best 之后
    # 1000 步内没有 ≥ min_delta 的提升就收，避免在平台期白跑几千步。
    eval_every: 500
    patience: 2
    min_delta: 0.05
    # 定期存档间隔（另有一份 model_best.ply 在验证刷新时写）
    save_every: 5000
    # 后台预取线程数：0 关闭。取数（PNG 解码）常是 GPU 空转的主因。
    prefetch_workers: 2
    # 大角度验证：早停时额外渲染 ±20/30/40° 视角，统计轮廓内的孔洞比例，
    # 用 `PSNR − λ·缺口` 作为早停指标。只按正脸 PSNR 早停会选出"只在正脸好"
    # 的模型（详见 docs/ISSUES.md）。
    robust_eval: true
    # 参与大角度统计的验证帧数（等间隔抽样，保证不同检查点可比）
    robust_eval_frames: 24
    # λ：缺口比例折算成 dB。10 表示 10% 缺口约等于 1 dB。
    robust_eval_weight: 10.0
    # 训练产物写到 <output_dir>/train/<subject>/<work_name>/
    max_frames: null

    # 新视角几何监督（默认开启：spill-only 已验证；--no-spill 可回退原版）。
    # 每 every 步随机采一个 ±yaw 视角：
    # - spill：在 FLAME 表面外扩 margin 像素之外，罚 alpha∈(alpha_min, alpha_max)
    #   的半透明溢出（薄雾）；实色头发不罚。已验证 weight 0.05。
    # - hole：只在"表面 ∩ 数据支持过的面"上罚 alpha<0.5。未采纳：会显著增加
    #   碎裂（spike +15%），保持 0。
    novel_view:
      every: 4
      spill_weight: 0.05
      hole_weight: 0.0
      # 表面外扩像素：给头发/发丝留余量
      spill_margin: 12
      alpha_min: 0.05
      alpha_max: 0.6
      min_px: 16
      frames: 80
      yaws: [-50, -40, -30, -20, -10, 10, 20, 30, 40, 50]
      # 早停指标里"面外溢出"的权重；0 = 不计（保持旧行为）
      robust_spill_weight: 0.0

    # 后训练（迭代修复）：默认关闭。开启后，train.py 在基础训练落地后调用
    # scripts/iterative_repair.py：数据驱动 top-N 选角、累计伪标签、
    # 真实帧 8 : 伪标签 2、按 SSIM-LPIPS 选最佳并早停。
    # 需要 diffusers + epiCRealism 权重；基础模型不依赖它。
    #
    # post_train.sh 直接读这里（scripts/show_config.py --shell-post）；
    # 改这里即可，不用再同步脚本。临时消融可用 POST_* 环境变量覆盖。
    post_train:
      top_n: 2
      # auto：按数据集训练段的 |yaw|/|pitch| p90 作为覆盖边缘，再向外扩；
      # 也可以写死 "20,10;30,20;..."。角度都是相对头部的绝对值。
      rings: "auto"
      steps: 100
      # 训练 batch = real_per_batch + refined_per_batch，两种模式共用
      refined_per_batch: 2
      real_per_batch: 6
      # 修复方式：syncfix=全图+SyncFix（默认）；mask_diffusion=当前掩码+扩散；none=纯真实帧消融
      repair_mode: syncfix
      # SyncFix 是独立仓库/环境；路径留空，由 configs/local.yaml 或环境变量给出。
      # 运行时按需检测这些路径，不再维护 syncfix_ready 开关。
      syncfix_repo: ""
      syncfix_python: syncfix
      syncfix_model: ""
      # 一次联合修复 4 张；参考图也给 4 张（find_defects 会取 4 个不同基帧）
      syncfix_n_per_pass: 4
      syncfix_ref_size: 4
      # 下降容差：最后一轮比当前最佳低不超过该值就保留最后一轮，
      # 超过才回退到最佳并停止。小角度留出集测不到大角度变化。
      quality_tol: 0.01
      psnr_weight: 0.002
      # 伪标签掩码向周围扩多少像素：范围太小扩散补不全眼睛/头顶/嘴巴
      mask_dilate: 12
      # 大掩码下填充率会下降，门限相应放宽
      min_fill: 0.4
      trusted_tol: 3.0
      # 锐度门：mean gradient 会把渲染噪点也算进去，大掩码容易被误判成糊，
      # 这里比旧默认（0.97/0.98）宽松一档；先看几张 accepted 再决定是否收紧。
      sharpen: 0.35
      min_sharp: 0.85
      min_mask_sharp: 0.85
      lr_xyz: 1e-5
      base_model: emilianJR/epiCRealism
      # 身份条件/颜色对齐是失败实验：默认关（见 docs/ISSUES.md）
      ip_adapter: none
      color_match: false
      color_ring: 8
      core_dilate: 12
      strength: 0.6
      feather: 4
      # 只修到最低观测像素附近：未观测的脖子/胸口最容易补出衣服、项链；
      # 宁可在那里留空，也不要生成假内容（不想要就改 false）
      head_cut: true
      head_cut_margin: 0
      prompt: "close-up of a bare face and neck, natural bare skin, visible pores, eyes looking straight ahead, soft light, plain background, sharp focus"
      negative: "looking at camera, looking at viewer, eye contact, side glance, cross-eyed, clothing, shirt, collar, jacket, scarf, necklace, earrings, jewelry, hat, glasses, makeup, lipstick, eyeshadow, blush, painted face, beauty filter, blurry, smooth plastic, deformed, extra eyes, low resolution, watermark"

  # 在线更新（热更新）：通话开始时用一小段观测微调外观。
  # 见 docs/TRAINING.md。
  online_update:
    # ---- 门控 ----
    # 总开关。关闭后 GUI / 脚本都不会执行在线更新。
    enabled: true
    # 是否更新不透明度（logit）。关闭则只改颜色：更稳，
    # 但无法修正"该透明的地方不透明"这类误差。
    update_opacity: true
    # 颜色损失用 L1 而不是 L2。
    # L1 对少量离群像素更稳健（高光、镜面反射、跟踪抖动的边缘），
    # 但收敛更慢；调试外观偏差时可以先试 L1。
    color_l1: false
    # 是否更新颜色（SH DC）。两个颜色/不透明度门控都关掉时，
    # 在线更新等价于空操作，此时应当直接跳过（不浪费预算）。
    update_color: true

    # ---- 预算 ----
    # 墙钟预算（秒）。**不能超过这个时间** —— 通话已经开始，用户不会等。
    # 实测 50 步即收敛，10 s 是宽松上限；本机 GPU 较弱时可放宽。
    time_budget_s: 10.0
    # 最大迭代数（与 time_budget_s 取先到者）
    steps: 300

    # ---- 优化 ----
    # 颜色（SH DC）与不透明度（logit）的学习率。
    # 颜色量级小、不透明度是 logit，两者差一个数量级，必须分开设。
    lr_color: 0.002
    lr_opacity: 0.02
    # 掩码外像素权重。0 = 只用前景（背景通常预测不准，忽略它能改善拟合）
    mask_weight: 0.0

    # ---- 观测 ----
    # 用于更新的帧数（从数据集/摄像头取多少帧）
    frames: 8
    # 每次迭代实际用几帧。小于 frames 时只用前若干帧 ——
    # 真实场景下帧是陆续到达的，不该假设能一次看完全部。
    frame_chunk: 8
