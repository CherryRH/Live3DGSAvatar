# Live3DGSAvatar —— 训练与在线更新配置
#
# 本文件集中存放**训练相关**的默认量；路径与设备见 configs/system.yaml，
# 渲染相关见 configs/render.yaml。字段说明见 docs/CONFIG.md。
#
# 这些参数都可以在 GUI 的「设置」浮窗里改并保存（写入 configs/local.yaml），
# 但只有标记为可编辑的才会真正作用到运行中的服务 —— 见 app/settings.py。

train:
  # 完整训练管线（待接入协作者的训练代码）。
  # 关闭时，任何训练入口都应直接报错退出，而不是静默跳过 ——
  # 静默跳过会让人以为"训练过了"。
  pipeline:
    # 训练入口：scripts/train.py。默认超参与 models/crh_1/test/config.yaml
    # 一致：batch 10、50000 步、blend_start 3000、末尾 350 帧作验证。
    enabled: true
    iterations: 50000
    batch_size: 10
    # 前 N 步不启用形变基（先用模板网格拟合静态外观）
    blend_start: 3000
    # 验证集比例：0.1 = 末尾 10% 作验证，其余训练。
    # 增强集按**同一比例**切分（它的验证部分不参与训练）。
    test_ratio: 0.1
    # 增强集目录（相对数据集），由 ./build_dataset.sh --into 生成。
    # 训练时加 --augment 才会用到；验证集永远只含真实数据。
    augment_dir: augmented
    # 增强样本的损失权重：1 = 与真实同权，0 = 完全不考虑。
    augment_weight: 1.0
    # 背景在损失里的权重：1 = 与前景同权（推荐）。
    # 设 0 会让落在人像之外的高斯拿不到梯度，推理时表现为"头周围发散"。
    mask_weight: 1.0
    # 验证频率与早停：每 eval_every 步验证一次，连续 patience 次无提升
    # （提升幅度小于 min_delta 视为无提升）就停。
    eval_every: 1000
    patience: 3
    min_delta: 0.05
    # 定期存档间隔（另有一份 model_best.ply 在验证刷新时写）
    save_every: 5000
    # 后台预取线程数：0 关闭。取数（PNG 解码）常是 GPU 空转的主因。
    prefetch_workers: 2
    # 大角度验证：早停时额外渲染 ±20/30/40° 视角，统计轮廓内的孔洞比例，
    # 用 `PSNR − λ·缺口` 作为早停指标。只按正脸 PSNR 早停会选出"只在正脸好"
    # 的模型（详见 docs/PIPELINE_ROBUSTNESS.md）。
    robust_eval: true
    # 参与大角度统计的验证帧数（等间隔抽样，保证不同检查点可比）
    robust_eval_frames: 24
    # λ：缺口比例折算成 dB。10 表示 10% 缺口约等于 1 dB。
    robust_eval_weight: 10.0
    # 大角度孔洞正则：每隔 hole_every 步，在 ±hole_yaw 内随机取一个视角渲染，
    # 把轮廓内 alpha 不足（relu(0.5 − α)）作为一项损失。0 表示关闭。
    # 权重不宜大：它只负责"别在斜视角塌掉"，不负责细节。
    # 权重从小开始：0.1 的实测结果是"缺口 −89%、锐度 −51%"，属于把表面糊住。
    hole_weight: 0.03
    hole_every: 20
    # 从第几步开始（默认与 blend_start 相同，即形变基启用之后）
    hole_start: 3000
    # 采样的最大水平角（度）
    hole_yaw: 40.0
    # 只有 α 低于该值才罚。0.5 会把"略薄但没破"的地方也推实，导致整体变糊。
    hole_threshold: 0.3
    # UV 邻域平滑：惩罚 offset 与邻域均值的差（相对量纲）。
    # 基线模型上这个相对值约 0.86（邻域之间几乎无关），权重 0.003 约相当于
    # L1 项的 8%。0 表示关闭。
    smooth_weight: 0.0
    # 按三角面分配采样点的密度（v2 格式）。0 = 沿用 UV texel 绑定（v1）。
    # 1.0 ≈ 每 texel 一个点；2.0 ≈ 12.6 万高斯（零空面）。渲染时间随 N 线性上升。
    capacity_density: 0.0
    # 尺度相对启动快照的最大倍数（硬投影）。默认 0 = 不限制。
    # 教训：1.5 倍的上限会把整个尺度分布压到 1.2 mm 以内（等于 1.5×初始 0.8 mm），
    # 中位尺度反而涨 37%、不透明度>0.5 的比例翻倍 —— 限制表达能力、逼模型用不透明度
    # 补偿。要抑制"个别高斯吹大"，应靠降权与缺陷掩码，而不是硬上限。
    hole_scale_cap: 0.0
    # 训练产物写到 <output_dir>/train/<subject>/<work_name>/
    max_frames: null

  # 在线更新（热更新）：通话开始时用一小段观测微调外观。
  # 见 docs/ONLINE_UPDATE.md。
  online_update:
    # ---- 门控 ----
    # 总开关。关闭后 GUI / 脚本都不会执行在线更新。
    enabled: true
    # 是否更新不透明度（logit）。关闭则只改颜色：更稳，
    # 但无法修正"该透明的地方不透明"这类误差。
    update_opacity: true
    # 颜色损失用 L1 而不是 L2。
    # L1 对少量离群像素更稳健（高光、镜面反射、跟踪抖动的边缘），
    # 但收敛更慢；调试外观偏差时可以先试 L1。
    color_l1: false
    # 是否更新颜色（SH DC）。两个颜色/不透明度门控都关掉时，
    # 在线更新等价于空操作，此时应当直接跳过（不浪费预算）。
    update_color: true

    # ---- 预算 ----
    # 墙钟预算（秒）。**不能超过这个时间** —— 通话已经开始，用户不会等。
    # 实测 50 步即收敛，10 s 是宽松上限；本机 GPU 较弱时可放宽。
    time_budget_s: 10.0
    # 最大迭代数（与 time_budget_s 取先到者）
    steps: 300

    # ---- 优化 ----
    # 颜色（SH DC）与不透明度（logit）的学习率。
    # 颜色量级小、不透明度是 logit，两者差一个数量级，必须分开设。
    lr_color: 0.002
    lr_opacity: 0.02
    # 掩码外像素权重。0 = 只用前景（背景通常预测不准，忽略它能改善拟合）
    mask_weight: 0.0

    # ---- 观测 ----
    # 用于更新的帧数（从数据集/摄像头取多少帧）
    frames: 8
    # 每次迭代实际用几帧。小于 frames 时只用前若干帧 ——
    # 真实场景下帧是陆续到达的，不该假设能一次看完全部。
    frame_chunk: 8
