# Live3DGSAvatar —— 训练与在线更新配置
#
# 本文件集中存放**训练相关**的默认量；路径与设备见 configs/system.yaml，
# 渲染相关见 configs/render.yaml。字段说明见 docs/CONFIG.md。
#
# 这些参数都可以在 GUI 的「设置」浮窗里改并保存（写入 configs/local.yaml），
# 但只有标记为可编辑的才会真正作用到运行中的服务 —— 见 app/settings.py。

train:
  # 完整训练管线（待接入协作者的训练代码）。
  # 关闭时，任何训练入口都应直接报错退出，而不是静默跳过 ——
  # 静默跳过会让人以为"训练过了"。
  pipeline:
    # 训练入口：scripts/train.py。默认 batch 10、50000 步、blend_start 3000；
    # 验证集统一取**末尾 30%**（test_ratio），不再使用固定的 350 帧。
    enabled: true
    # 选模型/早停：PSNR + 50·SSIM + 50·(1−LPIPS)（感知项在抽样帧上算）
    selection:
      ssim: 50.0
      lpips: 50.0
      perceptual_frames: 240
    # 加密阶段：alpha 直接向 GT 前景 mask 回归（治"半透明 + 轮廓外黑色薄雾"）
    alpha_weight: 0.2
    # 修复图生成（scripts/make_repairs.py 读取；脚本里不再挂这些参数）
    repair:
      # 角度：从训练段各方向的 auto_quantile 起，步长 step，最多外推
      # auto_quantile+auto_extrapolate；yaw_only 只做 yaw 扇
      auto_quantile: 90
      auto_extrapolate: 90
      yaw_only: true
      step: 5
      # 渲染/参考图：灰底更接近照片；参考图**至少 3 张**（基帧作中心/身份参考，
      # 左右各一张近 ±20° 的真实帧）；refs_auto 更大时继续加，ref_size 自动跟随
      view_bg: 0.8
      refs_auto: 3
      # 有效性：FLAME 头部区最大连通缺口 > max_hole_px 判定破洞，整侧封顶
      max_hole_px: 3000
      # 修复图在"渲染轮廓之外"凭空造出的像素上限（SyncFix 幻觉，如双侧耳朵）
      max_invented_px: 1000
      invented_dilate: 8
      # 渲染覆盖率下限（base 没画出来的角度直接跳过）
      min_coverage: 0.65
      # 抠图方式：key=按背景色键控（默认，背景是我们自己渲染的灰底）；
      # birefnet=人像 matting（极端角度会切掉头发）；auto=两者取并集
      mask: key
      key_threshold: 18
      # 键控后向内收几像素，去掉 SyncFix 残留的背景描边
      edge_shrink: 1
      # mask 内纯黑洞修补
      inpaint: true
      # SyncFix 每次喂几张（少 = 模型加载次数多，多 = 显存高）
      syncfix_batch: 4
      ref_size: 3
      sharpen: 0.35

    # 单阶段头像重建：UV 初始化 → tex 512 统一集合 → 训练。
    # 修复图（由 base 生成）按 batch 混入；加密是可开关的挂载项（默认关）。
    # 入口：bash train_avatar.sh --subject <对象> [--densify]
    avatar:
      # 步数是上限；正常 3000~6000 步内收敛（早停 patience 4）
      steps: 10000
      batch: 8
      # 每批混入的修复图张数（0 = 不用修复图）
      repair: 2
      # 修复图退火：none / linear / cosine（衰减样本权重）/ ratio（后段减半 2/8→1/8）
      repair_schedule: ratio
      repair_final_weight: 0.2
      blend_start: 0
      ssim_weight: 0.1
      # LPIPS 低权重、后段启用（每步慢 4~5 倍）
      lpips_weight: 0.01
      lpips_from: 5000
      # xyz 用 2e-4：发丝/轮廓靠位置微调补
      xyz_lr: 0.0002
      tex_size: 512
      # 选模型用组合分（PSNR+50·SSIM+50·(1−LPIPS)）；评估只抽 240 帧，
      # 组合分会抖，patience 2 会提前停在 4500 附近
      patience: 4
      # ---- 加密（默认关；--densify 打开）----
      densify:
        every: 300
        count: 900
        max_gaussians: 200000
        prune_opacity: 0.01
        # 分裂副本沿自身尺度的位移（1σ）；0 = 原地复制（会与父高斯重合）
        split_jitter: 0.8
        # 选点权重：大角度覆盖缺口 vs 颜色残差（0=纯颜色）
        split_hole_weight: 0.0
        # 分裂方向：quad=切平面 4 方向轮转，random=随机
        split_pattern: random
        # 分裂方式：copy=父不动+追加副本；subdivide=父换成两个子高斯
        split_mode: copy
        split_scale: 0.7
    iterations: 10000
    batch_size: 10
    # 前 N 步不启用形变基（先用模板网格拟合静态外观）
    blend_start: 3000
    # 位置类学习率的尺度（1.0 = 米制默认）。头部约 0.2 m 时通常保持 1.0，
    # 换到量级完全不同的场景才需要调。
    scene_extent: 1.0
    # 验证集比例：0.3 = 末尾 30% 作验证，其余训练。
    # 增强集按**同一比例**切分（它的验证部分不参与训练）。
    test_ratio: 0.3
    # 背景在损失里的权重：1 = 与前景同权（推荐）。
    # 设 0 会让落在人像之外的高斯拿不到梯度，推理时表现为"头周围发散"。
    mask_weight: 1.0
    # 感知损失：默认 0（只用 L1，最稳）。SSIM 抑制 L1 的过度平滑，
    # 基础训练可试 0.02–0.05；LPIPS 更贵、容易带来颜色/纹理副作用，
    # 建议 20000 步后再开 0.01–0.03。权重是相对 L1 的，别照搬后训练的 0.2。
    ssim_weight: 0.1
    lpips_weight: 0.0
    lpips_from: 20000
    # 验证频率与早停：每 eval_every 步验证一次，连续 patience 次无提升
    # （提升幅度小于 min_delta 视为无提升）就停。500×2 ≈ best 之后
    # 1000 步内没有 ≥ min_delta 的提升就收，避免在平台期白跑几千步。
    eval_every: 500
    patience: 4
    min_delta: 0.05
    # 定期存档间隔（另有一份 model_best.ply 在验证刷新时写）
    save_every: 5000
    # 后台预取线程数：0 关闭。取数（PNG 解码）常是 GPU 空转的主因。
    prefetch_workers: 2
    # 大角度验证：早停时额外渲染 ±20/30/40° 视角，统计轮廓内的孔洞比例，
    # 用 `PSNR − λ·缺口` 作为早停指标。只按正脸 PSNR 早停会选出"只在正脸好"
    # 的模型（详见 docs/ISSUES.md）。
    robust_eval: true
    # 参与大角度统计的验证帧数（等间隔抽样，保证不同检查点可比）
    robust_eval_frames: 24
    # λ：缺口比例折算成 dB。10 表示 10% 缺口约等于 1 dB。
    robust_eval_weight: 10.0
    # 训练产物写到 <output_dir>/train/<subject>/<work_name>/
    max_frames: null

    # 新视角几何监督（默认开启：spill-only 已验证；--no-spill 可回退原版）。
    # 每 every 步随机采一个 ±yaw 视角：
    # - spill：在 FLAME 表面外扩 margin 像素之外，罚 alpha∈(alpha_min, alpha_max)
    #   的半透明溢出（薄雾）；实色头发不罚。已验证 weight 0.05。
    # - hole：只在"表面 ∩ 数据支持过的面"上罚 alpha<0.5。未采纳：会显著增加
    #   碎裂（spike +15%），保持 0。
    novel_view:
      every: 4
      spill_weight: 0.05
      hole_weight: 0.0
      # 表面外扩像素：给头发/发丝留余量
      spill_margin: 12
      alpha_min: 0.05
      alpha_max: 0.6
      min_px: 16
      frames: 80
      yaws: [-50, -40, -30, -20, -10, 10, 20, 30, 40, 50]
      # 早停指标里"面外溢出"的权重；0 = 不计（保持旧行为）
      robust_spill_weight: 0.0

  # 在线更新（热更新）：通话开始时用一小段观测微调外观。
  # 见 docs/TRAINING.md。
  online_update:
    # ---- 门控 ----
    # 总开关。关闭后 GUI / 脚本都不会执行在线更新。
    enabled: true
    # 是否更新不透明度（logit）。关闭则只改颜色：更稳，
    # 但无法修正"该透明的地方不透明"这类误差。
    update_opacity: true
    # 颜色损失用 L1 而不是 L2。
    # L1 对少量离群像素更稳健（高光、镜面反射、跟踪抖动的边缘），
    # 但收敛更慢；调试外观偏差时可以先试 L1。
    color_l1: false
    # 是否更新颜色（SH DC）。两个颜色/不透明度门控都关掉时，
    # 在线更新等价于空操作，此时应当直接跳过（不浪费预算）。
    update_color: true

    # ---- 预算 ----
    # 墙钟预算（秒）。**不能超过这个时间** —— 通话已经开始，用户不会等。
    # 实测 50 步即收敛，10 s 是宽松上限；本机 GPU 较弱时可放宽。
    time_budget_s: 10.0
    # 最大迭代数（与 time_budget_s 取先到者）
    steps: 300

    # ---- 优化 ----
    # 颜色（SH DC）与不透明度（logit）的学习率。
    # 颜色量级小、不透明度是 logit，两者差一个数量级，必须分开设。
    lr_color: 0.002
    lr_opacity: 0.02
    # 掩码外像素权重。0 = 只用前景（背景通常预测不准，忽略它能改善拟合）
    mask_weight: 0.0

    # ---- 观测 ----
    # 用于更新的帧数（从数据集/摄像头取多少帧）
    frames: 8
    # 每次迭代实际用几帧。小于 frames 时只用前若干帧 ——
    # 真实场景下帧是陆续到达的，不该假设能一次看完全部。
    frame_chunk: 8
